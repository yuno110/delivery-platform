plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'JPA / QueryDSL 실습'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	// 원조 com.querydsl(5.x)은 사실상 유지보수가 멈췄다. API·패키지(com.querydsl.*)가 같은
	// 커뮤니티 포크 io.github.openfeign.querydsl 을 쓴다. Hibernate 7(Boot 4)을 지원한다.
	querydslVersion = '7.3.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 문자열 유틸. StringUtils.trimToNull / isBlank 등. 버전은 Spring Boot BOM 이 관리한다
	implementation 'org.apache.commons:commons-lang3'

	// Lombok (annotationProcessor 선언은 QueryDSL보다 먼저)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// QueryDSL — 컴파일 시 @Entity 마다 Q클래스를 build/generated/sources/annotationProcessor 에 생성한다
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// DB
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// seed 태그는 jpa 시드가 있어야 돌아간다 → 기본 test 에서는 뺀다
	useJUnitPlatform {
		excludeTags 'seed'
	}
	// local(비밀번호) + test(jpa_test 스키마, ddl-auto: create)
	systemProperty 'spring.profiles.active', 'local,test'
}

// Step 5 쿼리 연습: 시드가 있는 jpa 스키마에서 @Tag("seed") 테스트만 실행
//   ./gradlew seedTest
tasks.register('seedTest', Test) {
	description = '시드가 있는 jpa 스키마에서 @Tag("seed") 테스트만 실행한다 (Step 5 쿼리 연습)'
	group = 'verification'
	// 직접 만든 Test 태스크는 어떤 클래스를 돌릴지 모르므로 test 와 같은 곳을 알려 준다
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'seed'
	}
	// test 프로파일이 없으니 application.yml 기본값 그대로 → jpa 스키마 + validate
	// seed 가 아니라 seedtest: seed 를 켜면 SeedRunner 가 돌아 "이미 데이터가 있습니다"로 죽는다
	systemProperty 'spring.profiles.active', 'local,seedtest'
	// 코드가 그대로면 Gradle 이 UP-TO-DATE 로 건너뛴다. 결과가 DB 상태에 달렸으니 매번 실행
	outputs.upToDateWhen { false }
}
